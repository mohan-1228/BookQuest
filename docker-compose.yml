services:
  # ===================== MongoDB =====================
  mongo:
    image: mongo:6
    container_name: bookquest-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - bookquest-network

  # ===================== Backend =====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookquest-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    networks:
      - bookquest-network

  # ===================== Frontend =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookquest-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bookquest-network

volumes:
  mongo-data:

networks:
  bookquest-network:
    driver: bridge
